server {
    listen 80;
    server_name localhost;
    root /opt/ev-platform/flashCharge-ui;
    index index.html;

    # JavaScript files with correct MIME type (MUST come before QR URL handling)
    location ~* \.js$ {
        add_header Content-Type application/javascript;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # CSS files with caching (MUST come before QR URL handling)
    location ~* \.css$ {
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Handle configure charge page
    location = /configure-charge.html {
        try_files /configure-charge.html =404;
    }

    # Handle charger selector
    location = /select-charger.html {
        try_files /select-charger.html =404;
    }

    # Handle login page
    location = /login.html {
        try_files /login.html =404;
    }

    # Handle QR code URLs: /flashcharge/CHARGER_ID (EXACT match only)
    location ~ ^/flashcharge/([A-Za-z0-9_-]+)$ {
        try_files /station-entry.html =404;
    }

    # Redirect root to charger selector
    location = / {
        return 302 /select-charger.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}